dataset:
  path: ../data_hydra/sphinx_compatible_waypoint_delta/square/ph/err_0.005/data
  camera_views: agentview_image+robot0_eye_in_hand_image
  image_size: 84
dp:
  shift_pad: 6
  cond_unet:
    kernel_size: 5
    use_prop: 1
